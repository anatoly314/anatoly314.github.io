{{- define "main" }}
<style>
  body { display: flex; flex-direction: column; height: 100dvh; }
  .main { flex: 1; min-height: 0; width: 100%; max-width: none; padding: 0; }
  .fullmap { display: block; width: 100%; height: 100%; border: 0; }
</style>
{{- $base := site.Params.israeliGisURL | default "https://anatoly.dev/israeli-gis/" }}
<iframe class="fullmap" id="fullmap" data-base="{{ $base }}" title="{{ .Title }}" allow="fullscreen"></iframe>
<noscript><a href="{{ $base }}">Open the map</a></noscript>
<script>
  (function () {
    var frame = document.getElementById('fullmap');
    // Forward this page's ?lang=..&layer=..#zoom/lat/lng to the map; embed is never forwarded.
    var params = new URLSearchParams(location.search);
    params.delete('embed');
    var qs = params.toString();
    frame.src = frame.dataset.base + (qs ? '?' + qs : '') + location.hash;
  })();
</script>
{{- end }}
